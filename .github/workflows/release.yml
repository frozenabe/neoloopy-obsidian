# Builds the plugin and publishes a GitHub Release with the three required assets
# (main.js, manifest.json, styles.css) whenever a version tag is pushed.
#
# Based on Obsidian's recommended release workflow, hardened for a public repo:
#   - third-party actions are pinned to a full commit SHA (supply-chain
#     integrity under `contents: write`), with the human-readable tag in a
#     trailing comment;
#   - dependencies install from the committed lockfile via `npm ci`.
#
# The release is created as a DRAFT — review it, then publish it so the
# obsidian-releases bot can see the assets. The tag MUST equal manifest.json's
# version exactly (no leading "v") — a human responsibility; this workflow does
# not guard it. See STORE-SUBMISSION.md.
#
# Each asset gets a signed GitHub build-provenance attestation, so anyone can
# cryptographically verify it was built from this source by this workflow:
#   gh attest verify --repo frozenabe/neoloopy-obsidian main.js

name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
      id-token: write # mint the OIDC token used to sign the attestation
      attestations: write # record the build-provenance attestation
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20.x"

      - name: Build plugin
        run: |
          npm ci
          npm run build --workspace @neoloopy/cld-canvas
          npm run build

      - name: Attest build provenance for the release assets
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # Pull this version's hand-written section out of CHANGELOG.md (the
          # lines between "## [<tag>]" and the next "## [" heading) so the
          # release body leads with the curated notes; --generate-notes then
          # appends GitHub's auto "What's Changed" / Full Changelog section.
          awk -v ver="$tag" '
            $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
            flag && /^## \[/ { exit }
            flag && /^\[[^][]*\]:/ { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            gh release create "$tag" \
              --title="$tag" \
              --draft \
              --notes-file release-notes.md \
              --generate-notes \
              main.js manifest.json styles.css
          else
            echo "::warning::No CHANGELOG.md section for $tag; using generated notes only."
            gh release create "$tag" \
              --title="$tag" \
              --draft \
              --generate-notes \
              main.js manifest.json styles.css
          fi
